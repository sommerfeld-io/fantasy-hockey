server {
    listen 80;
    server_name _;

    # The image's default access_log format is "main"; set "combined"
    # explicitly and send it to stdout.
    access_log /dev/stdout combined;

    # Docker's embedded DNS. Holding the upstream in a variable makes nginx
    # re-resolve the app's service name at request time, so a recreated app
    # container does not leave the proxy pointing at a stale IP (502).
    resolver 127.0.0.11 valid=10s;
    set $app http://fantasy-hockey:8080;

    # The app serves /metrics anonymously; hide it from anything that reaches
    # the proxy. The regex location outranks the "/" prefix location below and
    # matches /metrics and /metrics/ in any case. Return 404 without forwarding.
    location ~* ^/metrics/?$ {
        return 404;
    }

    location / {
        proxy_pass $app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
