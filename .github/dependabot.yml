---
version: 2
registries:
  dockerhub:
    type: docker-registry
    url: registry.hub.docker.com
    username: ${{ secrets.DOCKERHUB_USER }}
    password: ${{ secrets.DOCKERHUB_TOKEN }}
  dhi:
    type: docker-registry
    url: dhi.io
    username: ${{ secrets.DOCKERHUB_USER }}
    password: ${{ secrets.DOCKERHUB_TOKEN }}

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    registries:
      - dockerhub
      - dhi
    directory: .devcontainer
    schedule:
      interval: weekly

  - package-ecosystem: docker
    registries:
      - dockerhub
      - dhi
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    registries:
      - dockerhub
      - dhi
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /src
    schedule:
      interval: weekly
