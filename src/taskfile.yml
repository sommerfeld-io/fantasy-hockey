---
version: '3.42.1'

vars:
  BINARY_NAME: fantasy-hockey
  GO_PATH: PATH=$(go env GOPATH)/bin:$PATH
  # Install Go tools into GOPATH/bin, overriding a GOBIN preset by the environment
  # (the devcontainer image sets GOBIN=/usr/local/bin, which is not writable)
  GO_INSTALL: GOBIN=$(go env GOPATH)/bin go install

tasks:

  cleanup:
    desc: Clean Go build artifacts and fix file permissions + ownership
    dir: &dir '{{.TASKFILE_DIR}}'
    vars:
      GAME_DATA_FILE: fantasy-hockey.yml
    cmds:
      - rm -rf {{ .BINARY_NAME }}
      - |
        if [ -f {{ .GAME_DATA_FILE }} ]; then
          sudo chown $(id -u):$(id -g) {{ .GAME_DATA_FILE }}
          sudo chmod ugo+rw {{ .GAME_DATA_FILE }}
        fi

  lint:
    desc: Run golangci-lint to check code quality
    dir: *dir
    cmds:
      - "{{ .GO_INSTALL }} github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2"
      - "{{ .GO_PATH }} golangci-lint run --timeout 5m"

  complexity:
    desc: Run gocyclo to check code complexity
    dir: *dir
    vars:
      COMPLEXITY_LIMIT: 10
    cmds:
      - "{{ .GO_INSTALL }} github.com/fzipp/gocyclo/cmd/gocyclo@latest"
      - "{{ .GO_PATH }} gocyclo -over {{ .COMPLEXITY_LIMIT }} ."

  licenses:
    desc: Check Go licenses
    dir: *dir
    vars:
      MODULE: github.com/sommerfeld-io/fantasy-hockey
      ALLOWED_LICENSES: "MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,Unlicense"
    cmds:
      - "{{ .GO_INSTALL }} github.com/google/go-licenses@latest"
      - "{{ .GO_PATH }} go-licenses check --include_tests --ignore {{ .MODULE }} --allowed_licenses {{ .ALLOWED_LICENSES }} {{ .MODULE }}"
      - "{{ .GO_PATH }} go-licenses report --include_tests --ignore {{ .MODULE }} {{ .MODULE }}"

  vulncheck:
    desc: Scan for known vulnerabilities with govulncheck
    dir: *dir
    cmds:
      - "{{ .GO_INSTALL }} golang.org/x/vuln/cmd/govulncheck@latest"
      - "{{ .GO_PATH }} govulncheck -show verbose ./..."

  test:
    desc: Run unit tests with coverage report
    dir: *dir
    cmds:
      - go test -v -coverprofile=coverage.out . ./internal/...
      - go tool cover -func=coverage.out

  test:acceptance:
    desc: Run GoDog acceptance tests with end-to-end coverage of internal packages
    dir: *dir
    cmds:
      - go test -v -coverpkg=./internal/... -coverprofile=acceptance-coverage.out ./acceptance-tests/...
      - go tool cover -func=acceptance-coverage.out

  build:
    desc: Test and build the {{ .BINARY_NAME }} binary with Go
    dir: *dir
    cmds:
      - task: cleanup
      - go mod tidy
      - go fmt
      - go vet
      - task: lint
      - task: test
      - task: test:acceptance
      - task: complexity
      - task: licenses
      - task: vulncheck
      - CGO_ENABLED=0 GOOS=${TARGETOS} GOARCH=${TARGETARCH} go build -o {{ .BINARY_NAME }}

  run:
    desc: Run the {{ .BINARY_NAME }} binary
    dir: *dir
    cmds:
      - task: build
      # Defaults to the Mailpit SMTP sink (task docker:run:mailpit) so login
      # codes land in its web UI at http://localhost:8025 instead of a real inbox
      - SMTP_HOST=${SMTP_HOST:-localhost} SMTP_PORT=${SMTP_PORT:-1025} ./{{ .BINARY_NAME }}
