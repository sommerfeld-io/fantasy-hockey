<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login — Fantasy Hockey</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="page-body">
    <h1 class="app-name">Fantasy Hockey</h1>

    {{if eq .Step "confirmation"}}
    <div class="login-panel">
      <p class="meta">{{.Message}}</p>
    </div>
    {{else}}
    <form class="login-panel" method="post" action="/login">
      <div class="control-group">
        <label class="control-label" for="email">Email</label>
        <input class="login-input" type="email" id="email" name="email" autocomplete="off" required>
      </div>
      <button class="btn-primary" type="submit">Request code</button>
    </form>
    {{end}}
  </main>
</body>
</html>
