---
# See src/CLAUDE.md (symlink to .github/instructions/go.instructions.md) for the style rules
# this configuration enforces.
run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - revive
    - gocritic
    - errorlint
    - unconvert
    - misspell

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: false
  goimports:
    local-prefixes: github.com/sommerfeld-io/fantasy-hockey

issues:
  exclude-dirs:
    - _bmad
    - _bmad-output
