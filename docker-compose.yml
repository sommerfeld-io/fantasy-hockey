---
x-volumes: &volumes
  - /etc/timezone:/etc/timezone:ro
  - /etc/localtime:/etc/localtime:ro
  - project-root-volume:/workspaces/fantasy-hockey
x-workdir: &default-workdir /workspaces/fantasy-hockey
x-tty: &tty true

volumes:

  project-root-volume:
    driver: local
    driver_opts:
      type: none
      device: .
      o: bind

services:

  lint-yaml:
    image: cytopia/yamllint:latest
    volumes: *volumes
    working_dir: *default-workdir
    command: .
    tty: *tty

  lint-workflows:
    image: rhysd/actionlint:latest
    volumes: *volumes
    working_dir: *default-workdir
    command:
      - -color
      - .github/workflows/codeql.yml
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/dev-environment.yml
      - .github/workflows/housekeeping-issues-ai-refinement.yml
      - .github/workflows/housekeeping-issues.yml
      - .github/workflows/housekeeping-labels.yml
      - .github/workflows/housekeeping-project.yml
      - .github/workflows/pipeline.yml
      - .github/workflows/release.yml
      - .github/workflows/scan-container-images.yml
    tty: *tty

  lint-filenames:
    image: lslintorg/ls-lint:1.11.2
    volumes: *volumes
    working_dir: *default-workdir
    tty: *tty

  lint-folders:
    image: sommerfeldio/folderslint:latest
    volumes: *volumes
    working_dir: *default-workdir
    command: .
    tty: *tty

  lint-markdown-links:
    image: lycheeverse/lychee:latest
    volumes: *volumes
    working_dir: *default-workdir
    command: --config .lychee.toml .
    tty: *tty

  lint-gherkin:
    image: node:23.3.0-alpine3.19
    volumes: *volumes
    working_dir: *default-workdir
    command:
      - /bin/ash
      - -c
      - npx --yes gherkin-lint src/acceptance-tests/features
    tty: *tty

  fantasy-hockey-lint-dockerfile:
    image: &lint-dockerfile-image hadolint/hadolint:latest
    volumes: *volumes
    working_dir: *default-workdir
    entrypoint: hadolint Dockerfile

  # Local-dev-only SMTP sink: catches every mail the app sends (e.g. login
  # codes) instead of delivering it, so nothing ever reaches a real inbox.
  # Web UI at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - 8025:8025
      - 1025:1025

  fantasy-hockey:
    image: ${COMPOSE_PROJECT_NAME}-app:${DEV_TAG}
    restart: unless-stopped
    depends_on:
      - mailpit
    build:
      context: .
      dockerfile: Dockerfile
    # Overrides the Dockerfile's non-root USER for local dev only: the
    # bind-mounted data file below is owned by whatever UID runs on the
    # host, which won't generally match the image's baked-in fantasy-hockey
    # UID, so reading it as that user can fail even when its permission
    # bits look fine. Root sidesteps the mismatch; the Dockerfile's
    # production image still drops to the unprivileged user by default.
    user: root
    ports:
      - 8080:8080
    volumes:
      # Bind-mounts the same data file `task go:run` uses locally, so the
      # player list and issued login codes are hand-editable on the host
      # and survive a container rebuild instead of living only inside it.
      - ./src/fantasy-hockey.yml:/opt/fantasy-hockey/fantasy-hockey.yml
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
      - DATA_FILE=${DATA_FILE:-/opt/fantasy-hockey/fantasy-hockey.yml}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_APP_PASSWORD=${SMTP_APP_PASSWORD:-}
